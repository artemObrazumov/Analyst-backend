ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.artemobraz.ApplicationKt.module

database:
  url: "jdbc:postgresql://localhost:5432/analytics"
  user: "analytics"
  password: "secret"
  pool:
    maximumPoolSize: 2
    minimumIdle: 1

redis:
  url: "redis://localhost:6379"

jwt:
  accessSecret: "verySecretAccessToken"
  refreshSecret: "verySecretRefreshToken"
  issuer: "analytics-platform"
  audience: "admin"
  realm: "Analytics Admin"
  accessTokenTtlMinutes: 15
  refreshTokenTtlDays: 30
