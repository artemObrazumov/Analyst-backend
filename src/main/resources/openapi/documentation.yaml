openapi: "3.1.0"
info:
  title: Analytics Platform API
  version: "1.0.0"
  description: "Backend API for the Analytics Platform"
servers:
  - url: "http://localhost:8080"
    description: "Local development"

tags:
  - name: system
    description: "Health and metrics"
  - name: auth
    description: "Authentication"
  - name: events
    description: "Event ingestion"
  - name: apps
    description: "App management"
  - name: analytics
    description: "Analytics queries"

paths:
  /health:
    get:
      tags: [ system ]
      summary: "Returns service health status"
      operationId: getHealth
      responses:
        "200":
          description: "Service is healthy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      tags: [ system ]
      summary: "Returns Prometheus metrics"
      operationId: getMetrics
      responses:
        "200":
          description: "Prometheus scrape output"
          content:
            text/plain:
              schema:
                type: string

  /api/auth/register:
    post:
      tags: [ auth ]
      summary: "Registers a new admin user"
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: "User registered, tokens returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "409":
          description: "Email already in use"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags: [ auth ]
      summary: "Authenticates a user and returns tokens"
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Authentication successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/refresh:
    post:
      tags: [ auth ]
      summary: "Issues a new access token using a refresh token"
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "New token pair issued"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "Invalid or expired refresh token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me:
    get:
      tags: [ auth ]
      summary: "Returns the profile of the currently authenticated user"
      operationId: getMe
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Current user profile"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: "Missing or invalid access token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [ auth ]
      summary: "Invalidates a refresh token (no JWT required)"
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "Logged out successfully"

  /api/users/me/logout:
    post:
      tags: [ auth ]
      summary: "Revokes both access and refresh tokens, invalidating the session completely"
      operationId: userLogout
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "Session fully revoked"
        "401":
          description: "Missing or invalid access token"

  /api/projects:
    get:
      tags: [ apps ]
      summary: "Returns all projects owned by the current user"
      operationId: listProjects
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "List of projects"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: "Unauthorized"

    post:
      tags: [ apps ]
      summary: "Creates a new project and returns the API key exactly once"
      operationId: createProject
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: "Project created — API key shown only here, store it securely"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWithKeyResponse"
        "401":
          description: "Unauthorized"
        "422":
          description: "Validation error"

  /api/projects/{id}:
    get:
      tags: [ apps ]
      summary: "Returns a project by ID"
      operationId: getProject
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Project details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "403":
          description: "Access denied"
        "404":
          description: "Project not found"

    put:
      tags: [ apps ]
      summary: "Updates project name or description"
      operationId: updateProject
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: "Updated project"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "403":
          description: "Access denied"
        "404":
          description: "Project not found"

    delete:
      tags: [ apps ]
      summary: "Deletes a project and all its data"
      operationId: deleteProject
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Deleted"
        "403":
          description: "Access denied"
        "404":
          description: "Project not found"

  /api/projects/{id}/key:
    get:
      tags: [ apps ]
      summary: "Returns API key metadata (not the raw value — only visible on creation or rotation)"
      operationId: getKeyMeta
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "API key metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyMetaResponse"
        "403":
          description: "Access denied"
        "404":
          description: "No active key"

  /api/projects/{id}/key/rotate:
    post:
      tags: [ apps ]
      summary: "Revokes the current API key and issues a new one, shown exactly once"
      operationId: rotateKey
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "New API key — shown only here, store it securely"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreatedResponse"
        "403":
          description: "Access denied"
        "404":
          description: "Project not found"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        version:
          type: string
          example: "1.0.0"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Invalid input"

    RegisterRequest:
      type: object
      required: [ name, email, password ]
      properties:
        name:
          type: string
          example: "Artem Obrazumov"
        email:
          type: string
          example: "artemobraz@test.com"
        password:
          type: string
          example: "123456"

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          example: "artemobraz@test.com"
        password:
          type: string
          example: "123456"

    RefreshRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: "JWT refresh token received from /login or /register"
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyLWlkIiwianRpIjoianRpLWlkIn0.sig"

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Short-lived JWT for API access, signed with accessSecret"
          example: "eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOiIuLi4ifQ.sig"
        refreshToken:
          type: string
          description: "Long-lived JWT for obtaining a new token pair, signed with refreshSecret"
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIuLi4iLCJqdGkiOiIuLi4ifQ.sig"
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          description: "Access token lifetime in seconds"
          example: 900

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          example: "admin"

    CreateProjectRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          example: "My Mobile App"
        description:
          type: string
          example: "Production analytics project"

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectWithKeyResponse:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/ProjectResponse"
        apiKey:
          $ref: "#/components/schemas/ApiKeyCreatedResponse"

    ApiKeyMetaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ApiKeyCreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: "Raw API key — shown only once, store it securely"
          example: "proj_a3f8c2d1e4b7..."
        label:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
