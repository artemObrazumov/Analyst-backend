openapi: "3.1.0"
info:
  title: Analytics Platform API
  version: "1.0.0"
  description: "Backend API for the Analytics Platform"
servers:
  - url: "http://localhost:8080"
    description: "Local development"

tags:
  - name: system
    description: "Health and metrics"
  - name: auth
    description: "Authentication"
  - name: events
    description: "Event ingestion"
  - name: apps
    description: "App management"
  - name: analytics
    description: "Analytics queries"

paths:
  /health:
    get:
      tags: [ system ]
      summary: "Returns service health status"
      operationId: getHealth
      responses:
        "200":
          description: "Service is healthy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      tags: [ system ]
      summary: "Returns Prometheus metrics"
      operationId: getMetrics
      responses:
        "200":
          description: "Prometheus scrape output"
          content:
            text/plain:
              schema:
                type: string

  /api/auth/register:
    post:
      tags: [ auth ]
      summary: "Registers a new admin user"
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: "User registered, tokens returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "409":
          description: "Email already in use"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags: [ auth ]
      summary: "Authenticates a user and returns tokens"
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Authentication successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/refresh:
    post:
      tags: [ auth ]
      summary: "Issues a new access token using a refresh token"
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "New token pair issued"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "Invalid or expired refresh token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [ auth ]
      summary: "Invalidates a refresh token"
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "Logged out successfully"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        version:
          type: string
          example: "1.0.0"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Invalid input"

    RegisterRequest:
      type: object
      required: [ name, email, password ]
      properties:
        name:
          type: string
          example: "Artem Obrazumov"
        email:
          type: string
          example: "artemobraz@test.com"
        password:
          type: string
          example: "123456"

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          example: "artemobraz@test.com"
        password:
          type: string
          example: "123456"

    RefreshRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: "JWT refresh token received from /login or /register"
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyLWlkIiwianRpIjoianRpLWlkIn0.sig"

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Short-lived JWT for API access, signed with accessSecret"
          example: "eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOiIuLi4ifQ.sig"
        refreshToken:
          type: string
          description: "Long-lived JWT for obtaining a new token pair, signed with refreshSecret"
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIuLi4iLCJqdGkiOiIuLi4ifQ.sig"
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          description: "Access token lifetime in seconds"
          example: 900

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
