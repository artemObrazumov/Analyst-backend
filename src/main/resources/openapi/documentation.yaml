openapi: "3.1.0"
info:
  title: Analytics Platform API
  version: "1.0.0"
  description: "Backend API for the Analytics Platform"
servers:
  - url: "http://localhost:8080"
    description: "Local development"

tags:
  - name: system
    description: "Health and metrics"
  - name: auth
    description: "Authentication"
  - name: events
    description: "Event ingestion"
  - name: apps
    description: "App management"
  - name: analytics
    description: "Analytics queries"
  - name: experiments
    description: "A/B experiment management"
  - name: funnels
    description: "Funnel management"
  - name: dashboards
    description: "Dashboard management"

paths:
  /health:
    get:
      tags: [ system ]
      summary: "Returns service health status"
      operationId: getHealth
      responses:
        "200":
          description: "Service is healthy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      tags: [ system ]
      summary: "Returns Prometheus metrics"
      operationId: getMetrics
      responses:
        "200":
          description: "Prometheus scrape output"
          content:
            text/plain:
              schema:
                type: string

  /api/auth/register:
    post:
      tags: [ auth ]
      summary: "Registers a new admin user"
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: "User registered, tokens returned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "409":
          description: "Email already in use"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/login:
    post:
      tags: [ auth ]
      summary: "Authenticates a user and returns tokens"
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Authentication successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "Invalid credentials"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: "Validation error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/refresh:
    post:
      tags: [ auth ]
      summary: "Issues a new access token using a refresh token"
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "New token pair issued"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: "Invalid or expired refresh token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/users/me:
    get:
      tags: [ auth ]
      summary: "Returns the profile of the currently authenticated user"
      operationId: getMe
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "Current user profile"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: "Missing or invalid access token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: "User not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/logout:
    post:
      tags: [ auth ]
      summary: "Invalidates a refresh token (no JWT required)"
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "Logged out successfully"

  /api/users/me/logout:
    post:
      tags: [ auth ]
      summary: "Revokes both access and refresh tokens, invalidating the session completely"
      operationId: userLogout
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: "Session fully revoked"
        "401":
          description: "Missing or invalid access token"

  /api/projects:
    get:
      tags: [ apps ]
      summary: "Returns all projects owned by the current user"
      operationId: listProjects
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: "List of projects"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: "Unauthorized"

    post:
      tags: [ apps ]
      summary: "Creates a new project and returns the API key exactly once"
      operationId: createProject
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: "Project created — API key shown only here, store it securely"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectWithKeyResponse"
        "401":
          description: "Unauthorized"
        "422":
          description: "Validation error"

  /api/projects/{id}:
    get:
      tags: [ apps ]
      summary: "Returns a project by ID"
      operationId: getProject
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Project details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "403":
          description: "Access denied"
        "404":
          description: "Project not found"

    put:
      tags: [ apps ]
      summary: "Updates project name or description"
      operationId: updateProject
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: "Updated project"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "403":
          description: "Access denied"
        "404":
          description: "Project not found"

    delete:
      tags: [ apps ]
      summary: "Deletes a project and all its data"
      operationId: deleteProject
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Deleted"
        "403":
          description: "Access denied"
        "404":
          description: "Project not found"

  /api/projects/{id}/key:
    get:
      tags: [ apps ]
      summary: "Returns API key metadata (not the raw value — only visible on creation or rotation)"
      operationId: getKeyMeta
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "API key metadata"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyMetaResponse"
        "403":
          description: "Access denied"
        "404":
          description: "No active key"

  /api/projects/{id}/key/rotate:
    post:
      tags: [ apps ]
      summary: "Revokes the current API key and issues a new one, shown exactly once"
      operationId: rotateKey
      security:
        - bearerAuth: [ ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "New API key — shown only here, store it securely"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreatedResponse"
        "403":
          description: "Access denied"
        "404":
          description: "Project not found"

  /api/projects/{projectId}/experiments:
    get:
      tags: [ experiments ]
      summary: "Returns all experiments for a project"
      operationId: listExperiments
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "List of experiments"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExperimentResponse"
        "401":
          description: "Unauthorized"
        "403":
          description: "Access denied"
    post:
      tags: [ experiments ]
      summary: "Creates a new experiment"
      operationId: createExperiment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExperimentRequest"
      responses:
        "201":
          description: "Experiment created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          description: "Validation error"
        "401":
          description: "Unauthorized"
        "403":
          description: "Access denied"

  /api/projects/{projectId}/experiments/{id}:
    get:
      tags: [ experiments ]
      summary: "Returns an experiment with groups and tracked events"
      operationId: getExperiment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Experiment detail"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentDetailResponse"
        "403":
          description: "Access denied"
        "404":
          description: "Experiment not found"
    put:
      tags: [ experiments ]
      summary: "Updates experiment name, description or result"
      operationId: updateExperiment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExperimentRequest"
      responses:
        "200":
          description: "Updated experiment"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          description: "Validation error"
        "403":
          description: "Access denied"
        "404":
          description: "Experiment not found"
    delete:
      tags: [ experiments ]
      summary: "Deletes an experiment and its groups and tracked events"
      operationId: deleteExperiment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Deleted"
        "403":
          description: "Access denied"
        "404":
          description: "Experiment not found"

  /api/projects/{projectId}/experiments/{id}/status:
    put:
      tags: [ experiments ]
      summary: "Updates experiment status"
      operationId: updateExperimentStatus
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateExperimentStatusRequest"
      responses:
        "200":
          description: "Status updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentResponse"
        "400":
          description: "Invalid status"
        "403":
          description: "Access denied"
        "404":
          description: "Experiment not found"

  /api/projects/{projectId}/experiments/{id}/analysis:
    get:
      tags: [ experiments ]
      summary: "Returns conversion metrics per experiment group"
      operationId: analyzeExperiment
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Analysis result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentAnalysisResponse"
        "403":
          description: "Access denied"
        "404":
          description: "Experiment not found"

  /api/projects/{projectId}/experiments/{id}/groups:
    post:
      tags: [ experiments ]
      summary: "Adds a variant group to the experiment"
      operationId: addExperimentGroup
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExperimentGroupRequest"
      responses:
        "201":
          description: "Group added"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentGroupResponse"
        "400":
          description: "Validation error"
        "403":
          description: "Access denied"
        "404":
          description: "Experiment not found"

  /api/projects/{projectId}/experiments/{id}/groups/{gid}:
    delete:
      tags: [ experiments ]
      summary: "Removes a group from the experiment"
      operationId: removeExperimentGroup
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: gid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Group removed"
        "403":
          description: "Access denied"
        "404":
          description: "Group not found"

  /api/projects/{projectId}/experiments/{id}/events:
    post:
      tags: [ experiments ]
      summary: "Links an event type to the experiment for conversion tracking"
      operationId: addExperimentEvent
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExperimentEventRequest"
      responses:
        "201":
          description: "Event link added"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentEventResponse"
        "400":
          description: "Validation error"
        "403":
          description: "Access denied"
        "404":
          description: "Experiment not found"

  /api/projects/{projectId}/experiments/{id}/events/{eid}:
    delete:
      tags: [ experiments ]
      summary: "Removes an event type link from the experiment"
      operationId: removeExperimentEvent
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: eid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Event link removed"
        "403":
          description: "Access denied"
        "404":
          description: "Event link not found"

  /api/projects/{projectId}/funnels:
    get:
      tags: [ funnels ]
      summary: "Returns all funnels for a project"
      operationId: listFunnels
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "List of funnels"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FunnelResponse"
        "401":
          description: "Unauthorized"
        "403":
          description: "Access denied"

    post:
      tags: [ funnels ]
      summary: "Creates a new funnel"
      operationId: createFunnel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFunnelRequest"
      responses:
        "201":
          description: "Funnel created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelResponse"
        "400":
          description: "Validation error"
        "401":
          description: "Unauthorized"
        "403":
          description: "Access denied"

  /api/projects/{projectId}/funnels/{id}:
    get:
      tags: [ funnels ]
      summary: "Returns a funnel with its steps"
      operationId: getFunnel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Funnel with steps"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelDetailResponse"
        "403":
          description: "Access denied"
        "404":
          description: "Funnel not found"

    put:
      tags: [ funnels ]
      summary: "Updates funnel name or description"
      operationId: updateFunnel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFunnelRequest"
      responses:
        "200":
          description: "Updated funnel"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelResponse"
        "400":
          description: "Validation error"
        "403":
          description: "Access denied"
        "404":
          description: "Funnel not found"

    delete:
      tags: [ funnels ]
      summary: "Deletes a funnel and all its steps"
      operationId: deleteFunnel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Deleted"
        "403":
          description: "Access denied"
        "404":
          description: "Funnel not found"

  /api/projects/{projectId}/funnels/{id}/analysis:
    get:
      tags: [ funnels ]
      summary: "Returns funnel conversion metrics for a time period"
      operationId: analyzeFunnel
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "Start of period (ISO-8601, inclusive)"
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: "End of period (ISO-8601, inclusive)"
      responses:
        "200":
          description: "Funnel analysis"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelAnalysisResponse"
        "400":
          description: "Invalid period (from after to)"
        "401":
          description: "Unauthorized"
        "403":
          description: "Access denied"
        "404":
          description: "Funnel not found"

  /api/projects/{projectId}/funnels/{id}/steps:
    post:
      tags: [ funnels ]
      summary: "Adds a step to the funnel (appended at the end)"
      operationId: addFunnelStep
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFunnelStepRequest"
      responses:
        "201":
          description: "Step added"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelStepResponse"
        "400":
          description: "Validation error"
        "403":
          description: "Access denied"
        "404":
          description: "Funnel not found"

  /api/projects/{projectId}/funnels/{id}/steps/reorder:
    put:
      tags: [ funnels ]
      summary: "Reorders all steps in the funnel"
      operationId: reorderFunnelSteps
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderFunnelStepsRequest"
      responses:
        "200":
          description: "Steps reordered"
        "400":
          description: "stepIds must contain exactly all steps"
        "403":
          description: "Access denied"
        "404":
          description: "Funnel not found"

  /api/projects/{projectId}/funnels/{id}/steps/{stepId}:
    delete:
      tags: [ funnels ]
      summary: "Removes a step from the funnel"
      operationId: removeFunnelStep
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: stepId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Step removed"
        "403":
          description: "Access denied"
        "404":
          description: "Step not found"

  /api/projects/{projectId}/dashboards:
    get:
      tags: [ dashboards ]
      summary: "Returns all dashboards for a project"
      operationId: listDashboards
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "List of dashboards"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardResponse"
    post:
      tags: [ dashboards ]
      summary: "Creates a new dashboard"
      operationId: createDashboard
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDashboardRequest"
      responses:
        "201":
          description: "Dashboard created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"

  /api/projects/{projectId}/dashboards/{id}:
    get:
      tags: [ dashboards ]
      summary: "Returns a dashboard with series configuration"
      operationId: getDashboard
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: "Dashboard detail"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDetailResponse"
    put:
      tags: [ dashboards ]
      summary: "Updates dashboard name or description"
      operationId: updateDashboard
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDashboardRequest"
      responses:
        "200":
          description: "Updated dashboard"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
    delete:
      tags: [ dashboards ]
      summary: "Deletes a dashboard and all its series"
      operationId: deleteDashboard
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Deleted"

  /api/projects/{projectId}/dashboards/{id}/page:
    get:
      tags: [ dashboards ]
      summary: "Returns dashboard page with time-series data"
      operationId: getDashboardPage
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: "Dashboard page with time-series chart data"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardPageResponse"

  /api/projects/{projectId}/dashboards/{id}/series:
    post:
      tags: [ dashboards ]
      summary: "Adds a series to the dashboard"
      operationId: addDashboardSeries
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDashboardSeriesRequest"
      responses:
        "201":
          description: "Series added"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSeriesResponse"

  /api/projects/{projectId}/dashboards/{id}/series/reorder:
    put:
      tags: [ dashboards ]
      summary: "Reorders series on the dashboard"
      operationId: reorderDashboardSeries
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderDashboardSeriesRequest"
      responses:
        "200":
          description: "Series reordered"

  /api/projects/{projectId}/dashboards/{id}/series/{seriesId}:
    put:
      tags: [ dashboards ]
      summary: "Updates a series on the dashboard"
      operationId: updateDashboardSeries
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDashboardSeriesRequest"
      responses:
        "200":
          description: "Series updated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSeriesResponse"

    delete:
      tags: [ dashboards ]
      summary: "Removes a series from the dashboard"
      operationId: removeDashboardSeries
      security:
        - bearerAuth: [ ]
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: seriesId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: "Series removed"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        version:
          type: string
          example: "1.0.0"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Invalid input"

    RegisterRequest:
      type: object
      required: [ name, email, password ]
      properties:
        name:
          type: string
          example: "Artem Obrazumov"
        email:
          type: string
          example: "artemobraz@test.com"
        password:
          type: string
          example: "123456"

    LoginRequest:
      type: object
      required: [ email, password ]
      properties:
        email:
          type: string
          example: "artemobraz@test.com"
        password:
          type: string
          example: "123456"

    RefreshRequest:
      type: object
      required: [ refreshToken ]
      properties:
        refreshToken:
          type: string
          description: "JWT refresh token received from /login or /register"
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1c2VyLWlkIiwianRpIjoianRpLWlkIn0.sig"

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "Short-lived JWT for API access, signed with accessSecret"
          example: "eyJhbGciOiJIUzI1NiJ9.eyJ1c2VySWQiOiIuLi4ifQ.sig"
        refreshToken:
          type: string
          description: "Long-lived JWT for obtaining a new token pair, signed with refreshSecret"
          example: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIuLi4iLCJqdGkiOiIuLi4ifQ.sig"
        tokenType:
          type: string
          example: "Bearer"
        expiresIn:
          type: integer
          description: "Access token lifetime in seconds"
          example: 900

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        role:
          type: string
          example: "admin"

    CreateProjectRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          example: "My Mobile App"
        description:
          type: string
          example: "Production analytics project"

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    ProjectResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProjectWithKeyResponse:
      type: object
      properties:
        project:
          $ref: "#/components/schemas/ProjectResponse"
        apiKey:
          $ref: "#/components/schemas/ApiKeyCreatedResponse"

    ApiKeyMetaResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ApiKeyCreatedResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: "Raw API key — shown only once, store it securely"
          example: "proj_a3f8c2d1e4b7..."
        label:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateFunnelRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          example: "Purchase Funnel"
        description:
          type: string
          example: "Tracks user journey from view to purchase"

    UpdateFunnelRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    FunnelResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FunnelDetailResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FunnelStepResponse"

    FunnelStepResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        propertyFilters:
          type: object
          additionalProperties:
            type: string
        stepOrder:
          type: integer

    AddFunnelStepRequest:
      type: object
      required: [ eventType ]
      properties:
        eventType:
          type: string
          example: "button_click"
        propertyFilters:
          type: object
          additionalProperties:
            type: string

    ReorderFunnelStepsRequest:
      type: object
      required: [ stepIds ]
      properties:
        stepIds:
          type: array
          items:
            type: string
            format: uuid
          description: "All step IDs of the funnel in the desired order"

    FunnelAnalysisPeriod:
      type: object
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true

    FunnelStepAnalysis:
      type: object
      properties:
        stepId:
          type: string
          format: uuid
        eventType:
          type: string
        propertyFilters:
          type: object
          additionalProperties:
            type: string
        stepOrder:
          type: integer
        usersCount:
          type: integer
          format: int64
          description: "Users who reached this step in strict funnel order"
        conversionFromPrevious:
          type: number
          format: double
          nullable: true
          description: "Percent of users from previous step who reached this step"
        dropOffFromPrevious:
          type: number
          format: double
          nullable: true
          description: "Percent lost between previous step and this step"
        avgSecondsFromPrevious:
          type: number
          format: double
          nullable: true
          description: "Average seconds from previous step to this step"

    FunnelAnalysisResponse:
      type: object
      properties:
        funnelId:
          type: string
          format: uuid
        funnelName:
          type: string
        period:
          $ref: "#/components/schemas/FunnelAnalysisPeriod"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FunnelStepAnalysis"
        overallConversion:
          type: number
          format: double
          description: "Percent of first-step users who reached the last step"

    CreateExperimentRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true

    UpdateExperimentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        result:
          type: string
          nullable: true
          description: "Experiment outcome notes (e.g. winner variant)"

    UpdateExperimentStatusRequest:
      type: object
      required: [ status ]
      properties:
        status:
          type: string
          enum: [ draft, active, archived ]

    ExperimentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [ draft, active, archived ]
        result:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ExperimentGroupResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        propertyKey:
          type: string
          description: "Key in event properties JSON used to identify the variant"
        propertyValue:
          type: string
          description: "Value of the property for this group"
        label:
          type: string
          description: "Human-readable group name for UI"

    ExperimentEventResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
          description: "Event type from POST /api/events/ingest"
        note:
          type: string
          nullable: true

    ExperimentDetailResponse:
      allOf:
        - $ref: "#/components/schemas/ExperimentResponse"
        - type: object
          properties:
            groups:
              type: array
              items:
                $ref: "#/components/schemas/ExperimentGroupResponse"
            events:
              type: array
              items:
                $ref: "#/components/schemas/ExperimentEventResponse"

    AddExperimentGroupRequest:
      type: object
      required: [ propertyKey, propertyValue, label ]
      properties:
        propertyKey:
          type: string
          example: "checkout_layout"
        propertyValue:
          type: string
          example: "scroll"
        label:
          type: string
          example: "Single-page checkout"

    AddExperimentEventRequest:
      type: object
      required: [ eventType ]
      properties:
        eventType:
          type: string
          example: "checkout_completed"
        note:
          type: string
          nullable: true

    GroupAnalysisResponse:
      type: object
      properties:
        label:
          type: string
        propertyKey:
          type: string
        propertyValue:
          type: string
        exposed:
          type: integer
          format: int64
          description: "Users who sent any tracked event with this group's property"
        converted:
          type: integer
          format: int64
          description: "Exposed users who sent all tracked event types"
        conversionRate:
          type: number
          format: double
          description: "converted / exposed * 100, percent with 2 decimal places"

    ExperimentAnalysisResponse:
      type: object
      properties:
        experimentId:
          type: string
          format: uuid
        experimentName:
          type: string
        trackedEvents:
          type: array
          items:
            type: string
          description: "Event types linked to the experiment"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupAnalysisResponse"

    CreateDashboardRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
        description:
          type: string

    UpdateDashboardRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    DashboardResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true

    DashboardDetailResponse:
      allOf:
        - $ref: "#/components/schemas/DashboardResponse"
        - type: object
          properties:
            series:
              type: array
              items:
                $ref: "#/components/schemas/DashboardSeriesResponse"

    DashboardSeriesResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        period:
          type: string
          enum: [ 7d, 30d, 90d ]
        eventType:
          type: string
        platform:
          type: string
          nullable: true
        osVersion:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          description: "ISO 3166-1 alpha-2 country code"
        propertyFilters:
          type: object
          additionalProperties:
            type: string
        position:
          type: integer

    AddDashboardSeriesRequest:
      type: object
      required: [ label, eventType ]
      properties:
        label:
          type: string
        period:
          type: string
          enum: [ 7d, 30d, 90d ]
          default: 7d
        eventType:
          type: string
        platform:
          type: string
          nullable: true
        osVersion:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        propertyFilters:
          type: object
          additionalProperties:
            type: string

    UpdateDashboardSeriesRequest:
      type: object
      required: [ label, period, eventType ]
      properties:
        label:
          type: string
        period:
          type: string
          enum: [ 7d, 30d, 90d ]
        eventType:
          type: string
        platform:
          type: string
          nullable: true
        osVersion:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        propertyFilters:
          type: object
          additionalProperties:
            type: string

    ReorderDashboardSeriesRequest:
      type: object
      required: [ seriesIds ]
      properties:
        seriesIds:
          type: array
          items:
            type: string
            format: uuid

    DashboardPagePeriod:
      type: object
      properties:
        from:
          type: string
          format: date-time
          nullable: true
        to:
          type: string
          format: date-time
          nullable: true

    SeriesDataPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        count:
          type: integer
          format: int64

    DashboardSeriesWithData:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        period:
          type: string
        eventType:
          type: string
        platform:
          type: string
          nullable: true
        osVersion:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        propertyFilters:
          type: object
          additionalProperties:
            type: string
        position:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/SeriesDataPoint"

    DashboardPageResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        period:
          $ref: "#/components/schemas/DashboardPagePeriod"
        series:
          type: array
          items:
            $ref: "#/components/schemas/DashboardSeriesWithData"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
